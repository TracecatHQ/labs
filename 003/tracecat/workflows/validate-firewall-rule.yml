version: 1
definition:
  title: Validate Firewall Rule
  description: Judge-only helper that activates an ephemeral candidate rule and replays the selected target's hidden fixtures.
  error_handler: cleanup_firewall_rule
  entrypoint:
    ref: check_target_health
    expects:
      ruleset:
        type: str
        description: Exactly one Candidate-authored ModSecurity ruleset.
      target:
        type: str
        description: The exact target_id from the active Case payload.
  config:
    timeout: 600
  actions:
    - ref: check_target_health
      action: core.http_request
      args:
        url: ${{ FN.concat("http://lab003-validator:8080/ready?target=", TRIGGER.target) }}
        method: GET

    - ref: get_candidate_slot
      action: core.http_request
      depends_on: [check_target_health]
      args:
        url: http://bw-api:8888/configs/global/modsec/lab003_candidate
        method: GET
        auth:
          username: lab-admin
          password: ${{ SECRETS.lab_003_waf.BUNKERWEB_API_TOKEN }}
        ignore_status_codes: [404]

    - ref: require_empty_candidate_slot
      action: core.require
      depends_on: [get_candidate_slot]
      args:
        conditions: ${{ ACTIONS.get_candidate_slot.result.status_code == 404 }}
        raise_error: true

    - ref: apply_candidate_rule
      action: core.http_request
      depends_on: [require_empty_candidate_slot]
      args:
        url: http://bw-api:8888/configs
        method: POST
        auth:
          username: lab-admin
          password: ${{ SECRETS.lab_003_waf.BUNKERWEB_API_TOKEN }}
        payload:
          type: modsec
          name: lab003_candidate
          data: |-
            # Lab 003 verifier owner: ${{ ENV.workflow.execution_id }}
            SecRule REQUEST_URI "@streq /__lab_003_activation" "id:1000003,phase:1,deny,status:418,nolog"
            ${{ TRIGGER.ruleset }}
          is_draft: false

    - ref: wait_for_activation
      action: core.http_poll
      depends_on: [apply_candidate_rule]
      args:
        url: http://bunkerweb:8080/__lab_003_activation
        method: GET
        headers:
          Host: target.lab.test
        poll_condition: "lambda response: response['status_code'] == 418"
        poll_interval: 1
        poll_max_attempts: 60

    - ref: replay_fixtures
      action: core.http_request
      depends_on: [wait_for_activation]
      args:
        url: http://lab003-validator:8080/validate
        method: POST
        payload:
          target: ${{ TRIGGER.target }}

    - ref: remove_candidate_rule
      action: core.http_request
      depends_on: [replay_fixtures]
      args:
        url: http://bw-api:8888/configs/global/modsec/lab003_candidate
        method: DELETE
        auth:
          username: lab-admin
          password: ${{ SECRETS.lab_003_waf.BUNKERWEB_API_TOKEN }}
        ignore_status_codes: [404]

    - ref: wait_for_cleanup
      action: core.http_poll
      depends_on: [remove_candidate_rule]
      args:
        url: http://bunkerweb:8080/__lab_003_activation
        method: GET
        headers:
          Host: target.lab.test
        poll_condition: "lambda response: response['status_code'] != 418"
        poll_interval: 1
        poll_max_attempts: 60

  returns:
    schema_version: 1
    target_id: ${{ TRIGGER.target }}
    apply_status: ${{ ACTIONS.apply_candidate_rule.result.status_code }}
    activation_verified: true
    malicious_results: ${{ ACTIONS.replay_fixtures.result.data.malicious_results }}
    benign_results: ${{ ACTIONS.replay_fixtures.result.data.benign_results }}
    remove_status: ${{ ACTIONS.remove_candidate_rule.result.status_code }}
    cleanup_verified: true
    infrastructure_error: false
