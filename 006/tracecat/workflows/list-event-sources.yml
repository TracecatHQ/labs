version: 1
definition:
  title: List CTI-REALM Event Sources
  description: List the event sources available to the Sigma runner.
  entrypoint: {ref: list_sources, expects: {}}
  actions:
    - ref: list_sources
      action: core.http_request
      args:
        url: http://lab006-sigma:8080/v1/sources
        method: GET
        timeout: 20
  returns: ${{ ACTIONS.list_sources.result.data }}
