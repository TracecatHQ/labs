services:
  threat-logs:
    build:
      context: .
      dockerfile: target/Dockerfile
    image: tracecat-lab-004-threat-logs:local
    restart: unless-stopped
    networks:
      tracecat:
        aliases: [lab004-threat-logs]
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 90s

volumes:
  sqlite-data:

networks:
  tracecat:
    external: true
    name: ${TRACECAT_DOCKER_NETWORK:-tracecat-labs_core}
